spring.application.name=live-cricket

# ---------------------------------------------------------------------------
# DEFAULT PROFILE -> MySQL
# ---------------------------------------------------------------------------
# The database is created automatically (createDatabaseIfNotExist=true).
# Set your MySQL credentials below or through MYSQL_USER / MYSQL_PASSWORD.
spring.datasource.url=jdbc:mysql://localhost:3306/live_cricket?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

server.port=8080

# Frontend origins allowed to call the API (comma-separated)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---------------------------------------------------------------------------
# Live match simulator (acts as the live score feed)
# ---------------------------------------------------------------------------
cricket.simulation.enabled=true
# one delivery per live match every tick
cricket.simulation.tick-ms=2000
# overs for auto-scheduled matches
cricket.simulation.default-overs=10
# keep at least this many live + upcoming matches
cricket.simulation.min-active=3
# insert sample teams, players and matches on an empty database
cricket.seed.enabled=true
